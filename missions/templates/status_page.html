<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control | Status</title>
    <style>
        :root {
            --bg: #0a0a12;
            --card-bg: #161625;
            --primary: #00f2ff;
            --secondary: #7000ff;
            --accent: #ff007a;
            --success: #39ff14;
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            max-width: 500px;
            width: 90%;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent));
            border-radius: 22px;
            z-index: -1;
            opacity: 0.3;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            letter-spacing: 4px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .status-badge {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(57, 255, 20, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
        }

        .docs-link {
            display: block;
            margin-top: 2rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid var(--primary);
            padding: 12px;
            border-radius: 8px;
        }

        .docs-link:hover {
            background: var(--primary);
            color: var(--bg);
            box-shadow: 0 0 20px var(--primary);
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90px, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -2;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: center top;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="container">
        <h1>Mission Control</h1>
        <div class="status-badge">Systems Operational</div>
        <p style="opacity: 0.8; line-height: 1.6;">Todos los módulos de telemetría y procesamiento de datos están respondiendo dentro de los parámetros nominales.</p>
        <a href="/docs" class="docs-link">ACCEDER A DOCUMENTACIÓN API</a>
    </div>
</body>
</html>
